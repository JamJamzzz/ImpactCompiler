# AWS Amplify Hosting build spec for ImpactCompiler's review dashboard.
#
# The dashboard (web/) is a dependency-free static site — plain HTML/CSS/JS,
# no bundler, no package.json of its own. There is nothing to install or
# build, so this spec's only job is to tell Amplify which directory to
# publish as-is. This does NOT deploy or affect the ImpactCompiler CLI/engine
# in src/ — Amplify only ever serves web/.
version: 1
frontend:
  phases:
    build:
      commands: []
  artifacts:
    baseDirectory: web
    files:
      - '**/*'
  cache:
    paths: []
